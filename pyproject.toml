[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stdalign"
version = "0.2.0"
description = "The quantities of the std-alignment-framework's reporting standard: misalignment, its split, and its estimates from samples, on finite outcomes."
readme = "stdalign/README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools]
packages = ["stdalign"]
