name: checks

on:
  push:            # every branch: a step's branch is checked before its pull request is opened
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (items, fields, references, checks, bibliography, glossary, ontologies, standard, related, record)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: lint — 0 errors (rules R1–R13 in tools/lint.py)
        run: python3 tools/lint.py
      - name: the Obsidian view in obsidian/ is fresh (python3 tools/obsidian.py regenerates it)
        run: python3 tools/obsidian.py --check

  checks:
    name: checks (${{ matrix.simd }} SIMD path)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        simd: [default, haswell]   # a check must hold on both paths: its tolerance is derived, not tuned to one CPU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest (the checks of the core, and the tests of the linter)
        run: |
          if [ "${{ matrix.simd }}" = haswell ]; then
            export NPY_DISABLE_CPU_FEATURES=X86_V4 OPENBLAS_CORETYPE=Haswell
          fi
          python3 -m pytest
